<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">

        <h2>Welcome, This is our login page</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
            <li><a href="#">Review</a></li>
            <li class="notification">
                🔔
                <span class="badge">25+</span>
            </li>
        </ul>

    </nav>

    <div class="message-icon">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/018/931/952/small/message-3d-application-icon-png.png" alt="message icon">
    </div>
    <div class="login-box">

        <h2>Login Form</h2>

        <input type="text" placeholder="Enter Name">

        <div class="password">
            <input type="password" placeholder="Enter Password" maxlength="8">

            <span class="heart">
                ⭐
                <span class="tooltip">Only 8 characters are allowed</span>
            </span>
        </div>

        <button>Login</button>

    </div>

</body>
</html>
